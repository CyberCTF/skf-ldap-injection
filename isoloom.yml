# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF LDAP Injection (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask (Python 2) login that builds an LDAP search filter from the username and password (LDAP injection). The SKF lab folder python/Ldap-injection is
# vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-ldap-injection

networks:
  lab: { cidr: 10.60.160.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 180
  - name: a wrong login is checked against the LDAP directory
    script: checks/login.sh

message: |
  OWASP SKF LDAP Injection answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Your username and password become an LDAP filter: (&(cn=...)(sn=...)).
